name: CPU Test

permissions:
  contents: read

on:
  push:
    branches: [ main, stable/**/* ]
  pull_request:
    branches: [ main, stable/**/* ]
  workflow_dispatch:

  schedule:
    # Every day at noon and midnight
    - cron: '0 0,12 * * *'

jobs:

  lint:
    strategy:
      matrix:
        setup: [fast, slow, next]
      fail-fast: false
    name: Lint - ${{ matrix.setup }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Sync dependencies (fast)
        run: uv sync --frozen --group dev --no-default-groups
        if: matrix.setup == 'fast'
      - name: Upgrade dependencies (next)
        run: uv lock --upgrade
        if: matrix.setup == 'next'
      - name: Sync dependencies (slow)
        run: |
          uv sync --frozen \
            --extra apo \
            --extra weave \
            --extra verl \
            --extra mongo \
            --group dev \
            --group torch-cpu \
            --group torch-stable \
            --group trl \
            --group langchain \
            --no-default-groups
        if: matrix.setup != 'fast'
      - name: Sync isolated provider and Tinker environments
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-providers uv sync --frozen --no-default-groups --group dev --group agents --group core-stable
          UV_PROJECT_ENVIRONMENT=.venv-tinker uv sync --frozen --no-default-groups --group dev --group tinker --group torch-cpu
        if: matrix.setup != 'fast'
      # This pre-commit skips JavaScript on purpose.
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
      - name: Verify structured-output compatibility
        run: |
          uv run --no-sync python -c "import xgrammar, torch"
          uv run --no-sync pytest -v tests/test_xgrammar_compat.py
          uv run --no-sync pytest -v tests/instrumentation/test_verl_training_contract.py tests/instrumentation/test_verl_server_registration.py
          PYTHONPATH=.:examples/tinker .venv-tinker/bin/python -m pytest -v examples/tinker/tests/test_training_contract.py
          PYTHONPATH=.:examples/tinker .venv-tinker/bin/python -m pytest -v examples/tinker/tests/test_q20_agent.py
        if: matrix.setup != 'fast'
      - name: Check Python headers
        run: uv run --locked --no-sync scripts/check_headers.py
        if: matrix.setup == 'fast'
      - name: Run Black
        run: uv run --locked --no-sync black --check .
        if: matrix.setup != 'next'
      - name: Run isort
        run: uv run --locked --no-sync isort --check-only .
        if: matrix.setup != 'next'
      - name: Run pyright (fast)
        run: uv run --locked --no-sync pyright -p pyrightconfig.fast.json
        if: matrix.setup == 'fast'
      - name: Run pyright (slow)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          paths = []
          for env in (".venv", ".venv-providers", ".venv-tinker"):
              sites = list(Path(env).glob("lib/python*/site-packages"))
              if len(sites) != 1:
                  raise RuntimeError(f"Exactly one installed package directory required for {env}")
              paths.append(str(sites[0].resolve()))
          site = Path(f".venv-types/lib/python{sys.version_info.major}.{sys.version_info.minor}/site-packages")
          site.mkdir(parents=True, exist_ok=True)
          (site / "profiles.pth").write_text("\n".join(paths) + "\n")
          Path("pyrightconfig.ci.json").write_text(json.dumps({"extends": "./pyrightconfig.json", "venvPath": ".", "venv": ".venv-types"}))
          PY
          uv run --locked --no-sync pyright -p pyrightconfig.ci.json
        if: matrix.setup != 'fast'

  lint-js:
    name: Lint - JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: cd dashboard && npm ci
      - name: Run ESLint
        run: cd dashboard && npm run eslint
      - name: Run Prettier
        run: cd dashboard && npm run prettier
      - name: Run Stylelint
        run: cd dashboard && npm run stylelint
      - name: Run Typecheck
        run: cd dashboard && npm run typecheck
      - name: Verify build
        run: cd dashboard && npm run build

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --no-default-groups --group dev
      - name: Set source commit for docs
        run: |
          echo "SOURCE_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
      - name: Verify OpenAPI specification is up-to-date
        run: |
          uv run --locked --no-sync python scripts/export_openapi.py
          git diff --exit-code docs/assets/store-openapi.json
      - name: Build documentation
        run: uv run --locked --no-sync mkdocs build --strict
      - name: Upload docs artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: documentation-site
          path: site/
          compression-level: 6

  filesystem-compat:
    name: Filesystem security compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Sync locked dataset dependencies
        run: uv sync --frozen --no-default-groups --group dev --group image --group sql
      - name: Verify template sandbox and dataset storage
        run: uv run --no-sync pytest -v tests/test_fsspec_compat.py tests/test_security_boundaries.py tests/test_nltk_security.py

  test:
    strategy:
      matrix:
        mark:
          # store has many tests and is a good isolated group.
          - id: store
            display-name: Store
            pytest-mark: 'store'
          # AgentOps needs to be separated because it injects tricky global state.
          - id: agentops
            display-name: AgentOps
            pytest-mark: 'agentops'
          # Similar for Weave.
          - id: weave
            display-name: Weave
            pytest-mark: 'weave'
          # litellm proxy tests are slow
          - id: llmproxy
            display-name: LLM proxy
            pytest-mark: 'llmproxy'
          # Robustness of utilities is important. There are many tests.
          - id: utils
            display-name: Utilities
            pytest-mark: 'utils'
          # unmarked tests: adapter, execution engine, etc.
          - id: others
            display-name: Others
            pytest-mark: 'not store and not agentops and not weave and not llmproxy and not utils'
        env:
          - python-version: '3.11'
            setup-script: 'stable'
          - python-version: '3.12'
            setup-script: 'stable'
          - python-version: '3.13'
            setup-script: 'latest'
      fail-fast: false

    name: Test (${{ matrix.mark.display-name }}, ${{ matrix.env.setup-script }}, Python ${{ matrix.env.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: ${{ matrix.env.python-version }}
      - name: Upgrade dependencies (latest)
        run: uv lock --upgrade
        if: matrix.env.setup-script == 'latest'
      - name: Sync dependencies (latest)
        run: uv sync --frozen --no-default-groups --extra apo --extra weave --group dev --group agents --group langchain --group core-stable
        if: matrix.env.setup-script == 'latest'
      - name: Sync dependencies (stable)
        run: uv sync --frozen --no-default-groups --extra apo --extra weave --group dev --group agents --group langchain --group core-${{ matrix.env.setup-script }}
        if: matrix.env.setup-script != 'latest'
      - name: Freeze dependencies
        run: |
          set -ex
          uv pip freeze | tee requirements-freeze.txt
          echo "UV_LOCKED=1" >> $GITHUB_ENV
          echo "UV_NO_SYNC=1" >> $GITHUB_ENV
      - name: Upload dependencies artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dependencies-${{ matrix.mark.id }}-${{ matrix.env.python-version }}-${{ matrix.env.setup-script }}
          path: requirements-freeze.txt
          compression-level: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install JavaScript dependencies
        run: cd dashboard && npm ci
      - name: Build dashboard
        run: cd dashboard && npm run build

      - name: Run tests
        run: |
          uv run pytest -v --durations=0 tests -m "not mongo and not openai and not gpu and (${{ matrix.mark.pytest-mark }})"
        env:
          PYTEST_ADDOPTS: "--color=yes"

      - name: Verify stable LangChain security compatibility
        if: matrix.mark.id == 'others'
        run: |
          uv run --no-sync python -c "import langchain_openai; from PIL import Image"
          uv run --no-sync pytest -v tests/test_langchain_openai_security.py

      - name: Verify minimum supported LiteLLM security compatibility
        if: matrix.env.python-version == '3.11' && matrix.mark.id == 'others'
        run: |
          uv pip install --no-deps litellm==1.88.6
          uv run --no-sync pytest -v tests/test_crypto_compat.py tests/test_sso_compat.py tests/test_multipart_compat.py tests/llm_proxy/test_llm_proxy_cpu.py tests/llm_proxy/test_stream.py -m "not openai and not gpu"

  test-js:
    name: Test (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Sync Python dependencies
        run: uv sync --frozen --no-default-groups --extra apo --group dev --group agents --group core-stable
      - name: Install JavaScript dependencies
        run: cd dashboard && npm ci
      - name: Run vitest
        run: cd dashboard && npm run vitest
